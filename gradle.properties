# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings give readable parameter names + javadoc for Minecraft classes.
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
neo_version=21.1.249
neo_version_range=[21.1.0,)
loader_version_range=[4,)

## Mod Properties

# Must be lowercase, matching the regex [a-z][a-z0-9_]{1,63}, and match the MODID constant in the main mod class.
mod_id=actualgenerators
mod_name=Actual Generators
mod_license=LGPL-3.0-or-later
mod_version=0.1.0
mod_group_id=dev.symo.actualgenerators
mod_authors=Symo
mod_description=Generators, machines and item logistics for Minecraft.

# Optional integrations. Compile-time only for the API, runtime for testing in the dev client.
jei_minecraft_version=1.21.1
jei_version=19.51.0.417
jade_version=15.10.6+neoforge
guideme_version=21.1.17
