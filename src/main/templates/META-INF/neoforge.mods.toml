modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

issueTrackerURL="https://github.com/SymoHTL/ActualGenerators/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/SymoHTL/ActualGenerators"
authors="${mod_authors}"
description='''${mod_description}'''

# Uncomment once src/main/resources/${mod_id}.mixins.json exists.
#[[mixins]]
#config="${mod_id}.mixins.json"

# Uncomment to point at an AT other than META-INF/accesstransformer.cfg (which is picked up automatically).
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
